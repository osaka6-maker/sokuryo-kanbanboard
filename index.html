<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測量DB カンバンボード (Firebase版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
    .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; }
    .writing-vertical { writing-mode: vertical-rl; text-orientation: mixed; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col overflow-hidden text-slate-800">

  <!-- ================= ログイン画面 ================= -->
  <section id="login-screen" class="fixed inset-0 bg-slate-200 flex items-center justify-center p-4 z-50">
    <article class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-100">
      <header class="flex justify-center mb-4 text-5xl">🔒</header>
      <h2 class="text-xl font-bold text-center mb-6 text-slate-800 tracking-wider">測量DB 管理システム</h2>
      <form id="login-form" class="space-y-4">
        <label class="block">
          <span class="block text-sm font-bold text-slate-600 mb-1">メールアドレス</span>
          <input type="email" id="login-email" class="w-full border-2 border-slate-300 rounded-lg px-3 py-2 text-base focus:border-blue-500 outline-none transition-colors" required>
        </label>
        <label class="block">
          <span class="block text-sm font-bold text-slate-600 mb-1">パスワード</span>
          <input type="password" id="login-password" class="w-full border-2 border-slate-300 rounded-lg px-3 py-2 text-base focus:border-blue-500 outline-none transition-colors" required>
        </label>
        <footer>
          <button type="submit" id="btn-login-submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg text-base mt-4 shadow-md transition-colors">ログイン</button>
        </footer>
      </form>
    </article>
  </section>

  <!-- ================= メインアプリ画面 ================= -->
  <div id="main-app" class="hidden flex flex-col h-full w-full relative">
    <header class="bg-slate-800 text-white p-3 shadow-lg flex justify-between items-center shrink-0 z-20 select-none">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <span id="sync-icon" class="inline-block">🔄</span> 測量DB カンバンボード (Firebase)
      </h1>
      <nav class="flex items-center gap-3">
        <button id="btn-new-task" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-sm font-bold border border-emerald-500 text-white mr-1 shadow-sm transition-colors">➕ 新規作成</button>
        <span id="user-display-name" class="text-xs font-bold text-slate-300 border border-slate-600 px-2.5 py-1.5 rounded bg-slate-700"></span>
        <button id="btn-logout" class="flex items-center gap-1 hover:bg-slate-700 px-3 py-1.5 rounded text-xs font-medium border border-slate-600 transition-colors">🚪 ログアウト</button>
      </nav>
    </header>

    <!-- タブエリア -->
    <section class="bg-slate-200 border-b border-slate-300 flex flex-wrap items-end shrink-0 shadow-sm z-10 text-slate-700 select-none pt-2 px-2">
      <div class="flex gap-1 ml-2">
        <button id="tab-kanban" class="px-5 py-2 bg-slate-50 border-t border-l border-r border-slate-300 rounded-t-lg font-bold text-blue-700 relative top-[1px] shadow-sm z-10 cursor-pointer">📋 カンバン</button>
        <button id="tab-calendar" class="px-5 py-2 bg-slate-300 border border-slate-300 rounded-t-lg font-bold text-slate-500 hover:bg-slate-200 cursor-pointer">📅 カレンダー</button>
        <button id="tab-logs" class="px-5 py-2 bg-slate-300 border border-slate-300 rounded-t-lg font-bold text-slate-500 hover:bg-slate-200 cursor-pointer">📜 更新ログ</button>
      </div>
    </section>

    <!-- メインコンテンツ -->
    <main class="flex-1 overflow-hidden p-3 bg-slate-50 min-h-0 select-none relative">
      <!-- 1. カンバン表示 -->
      <div id="view-kanban" class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_auto] grid-rows-2 gap-3 h-full pb-2 min-h-0">
        <!-- 予定 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="予定">
          <header class="bg-slate-300 px-4 py-2 font-bold text-slate-800 flex justify-between items-center shrink-0">
            <span>予定</span><span class="count bg-white text-slate-600 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 測量前準備 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="測量前準備">
          <header class="bg-yellow-200 px-4 py-2 font-bold text-yellow-800 flex justify-between items-center shrink-0">
            <span>測量前準備</span><span class="count bg-white text-yellow-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 点群処理中 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="点群処理中">
          <header class="bg-blue-200 px-4 py-2 font-bold text-blue-800 flex justify-between items-center shrink-0">
            <span>点群処理中</span><span class="count bg-white text-blue-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 横断作成中 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="横断作成中">
          <header class="bg-orange-200 px-4 py-2 font-bold text-orange-800 flex justify-between items-center shrink-0">
            <span>横断作成中</span><span class="count bg-white text-orange-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 成果作成中 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="成果作成中">
          <header class="bg-indigo-200 px-4 py-2 font-bold text-indigo-800 flex justify-between items-center shrink-0">
            <span>成果作成中</span><span class="count bg-white text-indigo-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 設計待 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="設計待">
          <header class="bg-cyan-200 px-4 py-2 font-bold text-cyan-800 flex justify-between items-center shrink-0">
            <span>設計待</span><span class="count bg-white text-cyan-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- 確認待 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="確認待">
          <header class="bg-purple-200 px-4 py-2 font-bold text-purple-800 flex justify-between items-center shrink-0">
            <span>確認待</span><span class="count bg-white text-purple-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- ０円請求未 -->
        <section class="bg-slate-200 rounded-xl flex flex-col border-2 border-transparent drop-zone overflow-hidden shadow-inner min-h-0" data-status="０円請求未">
          <header class="bg-red-200 px-4 py-2 font-bold text-red-800 flex justify-between items-center shrink-0">
            <span>０円請求未</span><span class="count bg-white text-red-700 text-sm px-2.5 py-0.5 rounded-full shadow-sm">0</span>
          </header>
          <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-2 task-list min-h-0"></div>
        </section>
        <!-- サイドバーエリア省略（スペース都合上今回はメイン機能に集中） -->
      </div>

      <!-- 2. カレンダー表示 (仮実装) -->
      <div id="view-calendar" class="hidden flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden items-center justify-center text-slate-500">
        <h2 class="text-xl font-bold mb-4">📅 カレンダー表示</h2>
        <p>※データソースがFirebaseに切り替わりました。今後のフェーズでカレンダーのUIを拡充します。</p>
      </div>

      <!-- 3. 更新ログ表示 -->
      <div id="view-logs" class="hidden flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <header class="flex justify-between items-center px-6 py-3 bg-slate-100 border-b border-slate-200 shrink-0">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">📜 操作・更新履歴 (リアルタイム)</h2>
          <button id="btn-refresh-logs" class="px-3 py-1.5 bg-white border border-slate-300 rounded hover:bg-slate-50 text-xs font-bold text-slate-600 shadow-sm transition-colors">🔄 最新に更新</button>
        </header>
        <div class="flex-1 overflow-y-auto p-4">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-300 bg-slate-50 text-slate-600">
                <th class="py-2.5 px-3 font-bold">日時</th>
                <th class="py-2.5 px-3 font-bold">ユーザー</th>
                <th class="py-2.5 px-3 font-bold">案件ID</th>
                <th class="py-2.5 px-3 font-bold">操作種別</th>
                <th class="py-2.5 px-3 font-bold">詳細</th>
              </tr>
            </thead>
            <tbody id="logs-table-body" class="divide-y divide-slate-100 font-mono text-xs"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= トースト ================= -->
  <aside id="toast" class="hidden fixed bottom-6 right-6 px-5 py-3 rounded-lg shadow-2xl text-white flex items-center gap-3 z-[110] transition-all duration-300">
    <span id="toast-icon" class="text-xl">✅</span><span id="toast-msg" class="text-sm font-bold"></span>
  </aside>

  <!-- ================= JavaScript (Firebase連携) ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, onSnapshot, query, orderBy, limit, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ▼▼▼ ご自身のFirebase設定に書き換えてください ▼▼▼
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let tasks = [];
    let currentUser = null;
    let currentView = 'kanban';

    // --- 認証状態の監視 ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-display-name').textContent = `👤 ${user.email}`;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        setupRealtimeTasks();
        recordLog('-', 'ログイン', 'システムにログインしました');
      } else {
        currentUser = null;
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('main-app').classList.add('hidden');
      }
    });

    // --- ログイン処理 ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert('ログイン失敗: メールアドレスかパスワードが間違っています。');
      }
    });

    // --- ログアウト処理 ---
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // --- リアルタイムデータ同期 ---
    function setupRealtimeTasks() {
      onSnapshot(collection(db, 'tasks'), (snapshot) => {
        tasks = [];
        snapshot.forEach(docSnap => tasks.push({ id: docSnap.id, ...docSnap.data() }));
        if (currentView === 'kanban') renderKanban();
      });
    }

    // --- カンバン描画 ---
    function renderKanban() {
      document.querySelectorAll('.task-list').forEach(l => l.innerHTML = '');
      document.querySelectorAll('.count').forEach(c => c.textContent = '0');

      tasks.forEach(task => {
        const status = task['ステータス'] || '予定';
        const zone = document.querySelector(`.drop-zone[data-status="${status}"]`);
        if (!zone) return;
        
        const countEl = zone.querySelector('.count');
        countEl.textContent = parseInt(countEl.textContent) + 1;

        const card = document.createElement('article');
        card.draggable = true;
        card.className = "bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm cursor-pointer hover:border-blue-400 transition-all flex flex-col shrink-0 select-none";
        card.innerHTML = `
          <header class="flex justify-between items-center text-xs font-bold text-slate-800 mb-1">
            <span class="truncate">${task['お客様名'] || '-'}</span>
            <span class="text-slate-400 font-mono text-[11px]">${task['測量日'] || '未定'}</span>
          </header>
          <div class="text-xs text-slate-600 truncate mb-1.5 font-medium">${task['現場名'] || '-'}</div>
          <footer class="flex justify-between items-center text-[10px] text-slate-500 border-t pt-1 mt-auto">
            <span class="bg-slate-100 px-1.5 py-0.5 rounded">${task['営業所'] || '-'}</span>
            <span>👤 ${task['営業マン'] || '-'}</span>
          </footer>
        `;
        
        // ドラッグ開始
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('taskId', task.id);
          setTimeout(() => card.classList.add('opacity-40'), 0);
        });
        card.addEventListener('dragend', () => card.classList.remove('opacity-40'));
        
        zone.querySelector('.task-list').appendChild(card);
      });
    }

    // --- ドラッグ＆ドロップでステータス更新 ---
    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', async (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const taskId = e.dataTransfer.getData('taskId');
        const newStatus = zone.getAttribute('data-status');
        if (!taskId || !newStatus) return;
        
        try {
          await updateDoc(doc(db, 'tasks', taskId), { 'ステータス': newStatus });
          await recordLog(taskId, 'ステータス変更', `「${newStatus}」へ移動`);
          showToast(`ステータスを更新しました`);
        } catch (err) {
          console.error(err);
          alert('更新に失敗しました');
        }
      });
    });

    // --- 操作ログの保存と取得 ---
    async function recordLog(taskId, actionType, details) {
      if (!currentUser) return;
      try {
        await addDoc(collection(db, 'logs'), {
          timestamp: serverTimestamp(),
          userName: currentUser.email,
          taskId: taskId,
          actionType: actionType,
          details: details
        });
      } catch (e) {
        console.error('ログ記録エラー:', e);
      }
    }

    async function loadLogs() {
      const q = query(collection(db, 'logs'), orderBy('timestamp', 'desc'), limit(100));
      const snapshot = await getDocs(q);
      const tbody = document.getElementById('logs-table-body');
      tbody.innerHTML = '';
      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        const dateStr = d.timestamp ? new Date(d.timestamp.toDate()).toLocaleString('ja-JP') : '-';
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';
        tr.innerHTML = `
          <td class="py-2 px-3 text-slate-500 whitespace-nowrap">${dateStr}</td>
          <td class="py-2 px-3 font-bold text-slate-700">${d.userName}</td>
          <td class="py-2 px-3 text-blue-600 font-bold">${d.taskId}</td>
          <td class="py-2 px-3"><span class="px-2 py-0.5 rounded bg-slate-100 font-bold text-slate-800">${d.actionType}</span></td>
          <td class="py-2 px-3 text-slate-600">${d.details}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('btn-refresh-logs').addEventListener('click', loadLogs);

    // --- タブ切り替え ---
    function switchTab(view) {
      currentView = view;
      ['kanban', 'calendar', 'logs'].forEach(v => {
        const tab = document.getElementById(`tab-${v}`);
        const container = document.getElementById(`view-${v}`);
        if (v === view) {
          tab.className = "px-5 py-2 bg-slate-50 border-t border-l border-r border-slate-300 rounded-t-lg font-bold text-blue-700 relative top-[1px] shadow-sm z-10 cursor-pointer";
          container.classList.remove('hidden');
        } else {
          tab.className = "px-5 py-2 bg-slate-300 border border-slate-300 rounded-t-lg font-bold text-slate-500 hover:bg-slate-200 cursor-pointer";
          container.classList.add('hidden');
        }
      });
      if (view === 'logs') loadLogs();
      else if (view === 'kanban') renderKanban();
    }
    document.getElementById('tab-kanban').addEventListener('click', () => switchTab('kanban'));
    document.getElementById('tab-calendar').addEventListener('click', () => switchTab('calendar'));
    document.getElementById('tab-logs').addEventListener('click', () => switchTab('logs'));

    // --- トースト通知 ---
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
